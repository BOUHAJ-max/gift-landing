<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BOUHAJ Tools</title>
<meta name="description" content="BOUHAJ Tools — free tech & AI tools">
<meta name="theme-color" content="#030806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030806;--panel:#07120d;--line:#123d29;--neon:#39ff88;--neon2:#00e5ff;
  --text:#e8fff1;--muted:#7fa894;--warn:#ffd23f;
  --glow:0 0 18px rgba(57,255,136,.45),0 0 2px rgba(57,255,136,.9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text)}
body{font-family:"Cairo",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#matrix{position:fixed;inset:0;z-index:0;opacity:.18;pointer-events:none}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
.wrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:16px 16px 60px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 18px}
.logo{display:flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.5px}
.logo-mark{width:38px;height:38px;border:1.5px solid var(--neon);border-radius:10px;display:grid;place-items:center;
  color:var(--neon);box-shadow:var(--glow);font-size:15px}
.logo small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.lang{background:transparent;border:1px solid var(--line);color:var(--text);font:700 13px "JetBrains Mono",monospace;
  padding:8px 12px;border-radius:999px;cursor:pointer}
.lang:active{border-color:var(--neon)}

/* hero */
.hero{text-align:center;padding:26px 0 22px}
.term{display:inline-flex;align-items:center;gap:8px;font:500 12px "JetBrains Mono",monospace;color:var(--neon);
  border:1px solid var(--line);background:rgba(7,18,13,.8);padding:6px 12px;border-radius:999px;direction:ltr}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:var(--glow);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-size:clamp(30px,8.5vw,52px);font-weight:900;line-height:1.15;margin:18px 0 12px}
h1 .g{color:var(--neon);text-shadow:0 0 22px rgba(57,255,136,.55)}
.sub{color:var(--muted);font-size:16px;max-width:480px;margin:0 auto}
.type{font-family:"JetBrains Mono",monospace;color:var(--neon2);font-size:13px;margin-top:16px;min-height:20px;direction:ltr}
.type::after{content:"▌";animation:blink 1s infinite;margin-inline-start:2px}

/* controls */
.search{position:relative;margin:8px 0 12px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font:600 15px "Cairo",sans-serif;padding:14px 46px 14px 16px;border-radius:14px;outline:none;transition:.2s}
[dir=ltr] .search input{padding:14px 16px 14px 46px}
.search input:focus{border-color:var(--neon);box-shadow:var(--glow)}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:15px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--muted);
  font:700 13px "Cairo",sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s}
.chip.on{color:#02130a;background:var(--neon);border-color:var(--neon);box-shadow:var(--glow)}

/* cards */
.grid{display:grid;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{position:relative;overflow:hidden;background:linear-gradient(160deg,#0a1a12,#050c09);border:1px solid var(--line);
  border-radius:18px;padding:18px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:rise .5s both}
.card:hover,.card:active{transform:translateY(-3px);border-color:var(--neon);box-shadow:var(--glow)}
.card::before{content:"";position:absolute;inset:-1px;background:radial-gradient(400px 120px at var(--mx,50%) 0%,rgba(57,255,136,.14),transparent 60%);pointer-events:none}
.card.feat{grid-column:1/-1;border-color:rgba(57,255,136,.5)}
.card.target{border-color:var(--neon2);box-shadow:0 0 22px rgba(0,229,255,.5)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.c-head{display:flex;align-items:center;gap:12px}
.ico{flex:none;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:26px;
  background:rgba(57,255,136,.08);border:1px solid var(--line)}
.ico img{width:100%;height:100%;object-fit:contain;border-radius:inherit;background:#fff;padding:7px}
.c-title{font-weight:800;font-size:17px;line-height:1.35}
.badge{display:inline-block;font:700 10px "JetBrains Mono",monospace;color:#02130a;background:var(--warn);
  padding:2px 7px;border-radius:6px;margin-inline-start:6px;vertical-align:middle}
.c-desc{color:var(--muted);font-size:14px;margin:10px 0 14px;line-height:1.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;cursor:pointer;
  font:800 15px "Cairo",sans-serif;color:#02130a;background:linear-gradient(90deg,var(--neon),#2cf0b0);
  padding:13px;border-radius:12px;box-shadow:var(--glow);transition:filter .2s}
.btn:active{filter:brightness(1.15)}
.btn.soon{background:#0d1f16;color:var(--muted);box-shadow:none;cursor:default}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
.modal.open{display:flex}
@media(min-width:620px){.modal{align-items:center}}
.sheet{width:100%;max-width:460px;background:#06110c;border:1px solid var(--neon);border-radius:22px 22px 0 0;
  padding:22px 18px 26px;box-shadow:0 -10px 40px rgba(57,255,136,.25);animation:up .3s both}
@media(min-width:620px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .ico{margin:0 auto 10px;width:62px;height:62px;font-size:32px}
.sheet h3{text-align:center;font-size:20px;font-weight:900}
.steps{list-style:none;margin:18px 0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  padding:11px 13px;border-radius:12px;font-weight:600;font-size:14px}
.steps b{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font:700 13px "JetBrains Mono",monospace;color:var(--neon);border:1px solid var(--neon)}
.note{color:var(--muted);font-size:12px;text-align:center;margin-top:12px}
.x{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:600 14px "Cairo";cursor:pointer}

footer{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;font-family:"JetBrains Mono",monospace}
footer a{color:var(--neon);text-decoration:none}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="scan"></div>

<div class="wrap">
  <div class="top">
    <div class="logo"><div class="logo-mark">&gt;_</div><div>BOUHAJ TOOLS<small>by E-BOUHAJ TECH</small></div></div>
    <button class="lang" id="langBtn">EN</button>
  </div>

  <section class="hero">
    <span class="term"><span class="dot"></span><span id="status">system online</span></span>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="type" id="type"></div>
  </section>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty"></p>

  <footer>© <span id="yr"></span> <a href="https://instagram.com/bouhaj.ai" target="_blank" rel="noopener">@bouhaj.ai</a></footer>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="ico" id="mIco"></div>
    <h3 id="mTitle"></h3>
    <ol class="steps" id="mSteps"></ol>
    <button class="btn" id="mGo"></button>
    <p class="note" id="mNote"></p>
    <button class="x" id="mClose"></button>
  </div>
</div>

<script>
/* ======= النصوص ======= */
const T={
 ar:{h1:'أدوات تقنية <span class="g">مجانية</span><br>بضغطة واحدة',sub:'أدوات ذكاء اصطناعي ولينكس وبرمجة اخترتها لك من محتوى E-BOUHAJ TECH',
   q:'ابحث عن أداة...',all:'الكل',get:'احصل على الأداة',soon:'قريباً',empty:'لا توجد أداة بهذا الاسم',
   steps:['اضغط زر الفتح بالأسفل','أكمل خطوة قصيرة واحدة من القائمة','تفتح لك الأداة مباشرة'],
   go:'🔓 افتح الأداة الآن',note:'الخطوة القصيرة هي ما يُبقي هذه الأدوات مجانية لك',close:'إغلاق',
   cats:{ai:'ذكاء اصطناعي',video:'فيديو',linux:'لينكس',dev:'برمجة',apps:'تطبيقات',security:'أمن'},status:'النظام يعمل'},
 en:{h1:'Free tech tools<br><span class="g">one tap away</span>',sub:'AI, Linux and dev tools handpicked from E-BOUHAJ TECH content',
   q:'Search a tool...',all:'All',get:'Get the tool',soon:'Coming soon',empty:'No tool matches that',
   steps:['Tap the unlock button below','Complete one quick step from the list','Your tool opens right away'],
   go:'🔓 Unlock the tool',note:'The quick step is what keeps these tools free for you',close:'Close',
   cats:{ai:'AI',video:'Video',linux:'Linux',dev:'Dev',apps:'Apps',security:'Security'},status:'system online'}
};
const TYPE=['$ sudo unlock --tools','$ ai --generate hooks','$ ./bouhaj --free'];

/* ======= الحالة ======= */
let tools=[],lang,cat='all',current=null;
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
try{lang=params.get('lang')||localStorage.getItem('lang')}catch(e){}
if(!T[lang]) lang=(navigator.language||'ar').startsWith('ar')?'ar':'en';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=i=>/\.(png|jpe?g|webp|svg|gif)$/i.test(i||'')?`<img src="${esc(i)}" alt="">`:esc(i||'⚡');
const tx=o=>typeof o==='string'?o:(o?.[lang]||o?.en||o?.ar||'');

function applyLang(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  $('langBtn').textContent=lang==='ar'?'EN':'ع';
  $('h1').innerHTML=t.h1;$('sub').textContent=t.sub;$('q').placeholder=t.q;
  $('empty').textContent=t.empty;$('status').textContent=t.status;$('mClose').textContent=t.close;
  renderChips();render();
}

function renderChips(){
  const cats=[...new Set(tools.map(x=>x.category).filter(Boolean))];
  $('chips').innerHTML=['all',...cats].map(c=>
    `<button class="chip${c===cat?' on':''}" data-c="${esc(c)}">${esc(c==='all'?T[lang].all:(T[lang].cats[c]||c))}</button>`).join('');
}

function render(){
  const q=$('q').value.trim().toLowerCase(), target=params.get('t');
  const list=tools.filter(x=>(cat==='all'||x.category===cat)&&
    (!q||(tx(x.title)+' '+tx(x.desc)+' '+(x.keywords||[]).join(' ')).toLowerCase().includes(q)))
    .sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  $('grid').innerHTML=list.map((x,i)=>{
    const ok=!!x.url;
    return `<article class="card${x.featured?' feat':''}${x.id===target?' target':''}" data-id="${esc(x.id)}" style="animation-delay:${i*60}ms">
      <div class="c-head"><div class="ico">${icon(x.icon)}</div>
      <div class="c-title" ${x.dir? `dir="${esc(x.dir)}"`:''}>${esc(tx(x.title))}${x.badge?`<span class="badge" ${x.badgeDir? `dir="${esc(x.badgeDir)}"`:''}>${esc(x.badge)}</span>`:''}</div></div>
      <p class="c-desc" ${x.dir? `dir="${esc(x.dir)}"`:''}>${esc(tx(x.desc))}</p>
      <a class="btn${ok?'':' soon'}" style="text-decoration:none" ${x.buttonDir? `dir="${esc(x.buttonDir)}"`:''} href="${ok?esc(x.url):'#'}" ${ok&&x.target? `target="${esc(x.target)}" rel="${esc(x.rel||'')}"`:''}>${esc(x.buttonText|| (ok?'⚡ '+T[lang].get:T[lang].soon))}</a></article>`;
  }).join('');
  $('empty').style.display=list.length?'none':'block';
}

function openTool(id){
  const x=tools.find(t=>t.id===id); if(!x||!x.url) return;
  current=x;const t=T[lang];
  $('mIco').innerHTML=icon(x.icon);$('mTitle').textContent=tx(x.title);
  $('mSteps').innerHTML=t.steps.map((s,i)=>`<li><b>${i+1}</b>${esc(s)}</li>`).join('');
  $('mGo').textContent=t.go;$('mNote').textContent=t.note;
  $('modal').classList.add('open');
}

/* ======= الأحداث ======= */
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const link=e.target.closest('a.btn');if(link){e.stopPropagation();return;}openTool(c.dataset.id)});
$('grid').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px')}});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;renderChips();render()}});
$('q').addEventListener('input',render);
$('langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch(e){}applyLang()};
$('mGo').onclick=()=>{if(current){if(current.target==='_blank')window.open(current.url,'_blank','noopener,noreferrer');else location.href=current.url}};
$('mClose').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('open')};
$('yr').textContent=new Date().getFullYear();

/* ======= كتابة متحركة ======= */
(function typeLoop(i=0,j=0,del=false){
  const s=TYPE[i%TYPE.length];$('type').textContent=s.slice(0,j);
  if(!del&&j===s.length) return setTimeout(()=>typeLoop(i,j,true),1600);
  if(del&&j===0) return setTimeout(()=>typeLoop(i+1,0,false),300);
  setTimeout(()=>typeLoop(i,j+(del?-1:1),del),del?30:65);
})();

/* ======= خلفية ماتريكس ======= */
(function(){
  const c=$('matrix'),x=c.getContext('2d');let cols,drops;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}
  size();addEventListener('resize',size);
  setInterval(()=>{x.fillStyle='rgba(3,8,6,.12)';x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#39ff88';x.font='14px JetBrains Mono,monospace';
    drops.forEach((y,i)=>{const ch='01$>_#{}';x.fillText(ch[Math.random()*ch.length|0],i*16,y*16);drops[i]=y*16>c.height&&Math.random()>.97?0:y+1})},55);
})();

/* ======= تحميل الأدوات ======= */
fetch('tools.json?v='+Date.now()).then(r=>r.json()).then(d=>{
  tools=d.tools||[];applyLang();
  const t=params.get('t');
  if(t){const el=document.querySelector(`[data-id="${CSS.escape(t)}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});openTool(t)}
}).catch(()=>{applyLang();$('empty').style.display='block'});
</script>
</body>
</html>
